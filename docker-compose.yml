services:
  docling-gpu-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: docling-gpu-server
    image: docling-gpu-server:latest
    ports:
      - "8008:8008" # FastAPI
      - "8888:8888" # Jupyter Lab
    environment:
      - PORT=8008
      - API_KEY=${API_KEY:-your-secret-api-key-here}
      - CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES:-0}
      - DOCLING_CMD=${DOCLING_CMD:-docling}
    command: /bin/bash ./start.sh
    volumes:
      # 프로젝트 루트 전체를 /app에 마운트 (개발 시 코드/설정 변경 사항 즉시 반영)
      - .:/app
      
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
              
    restart: unless-stopped
    networks:
      - docling-network

networks:
  docling-network:
    driver: bridge

