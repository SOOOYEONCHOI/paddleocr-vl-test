services:
  paddle-ocr-vl:
    build:
      context: .
      dockerfile: Dockerfile
    image: paddle-ocr-vl:latest
    container_name: paddle-ocr-vl-test
    
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    
    # 호스트 8890 → 컨테이너 8890 포트 매핑
    ports:
      - "8890:8890"

    volumes:
      # 호스트의 현재 폴더를 /app 폴더로 마운트
      - .:/app
      # 모델 가중치는 전용 경로 유지(모델 가중치 영구 보존)
      - ./models:/root/.paddleocr

    # .env 파일에서 환경변수 로드 (LLM 설정 등)
    env_file:
      - .env

    environment:
      - PYTHONUNBUFFERED=1
      - PATH=/opt/venv/bin:$PATH
      - VIRTUAL_ENV=/opt/venv
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    
    # 작업 디렉토리를 새로 설정한 폴더로 변경
    working_dir: /app
    stdin_open: true
    tty: true
    restart: unless-stopped